<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Directory</title>
    <!-- Importing your typography style sheets -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Exact color palette matching your mobile theme mockup */
        body {
            background-color: #120e36;
            color: #d1d5db;
            font-family: 'Lora', serif;
            line-height: 1.8;
            padding: 40px 20px;
            max-width: 650px;
            margin: 0 auto;
        }

        /* Gold visual star track subtext */
        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e2b659;
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Serif header display match */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 400;
            color: #ffffff;
            text-align: center;
            line-height: 1.3;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
        }

        /* Explanatory menu description */
        .meta {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: #8b8ea9;
            text-align: center;
            margin-bottom: 40px;
        }

        /* List structure layout */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        /* Elegant design container block for links */
        li {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(226, 182, 89, 0.3);
            transform: translateY(-2px);
        }

        /* Soft purple link font settings */
        a {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            text-decoration: none;
            color: #c09fed;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="subtitle">
        <span>✦</span> DIGITAL LABORATORY <span>✦</span>
    </div>
    
    <h1>CODE & CREATIVE<br>EXPERIMENTS</h1>
