<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Experiments Directory</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; background: #f4f4f4; padding: 10px; border-radius: 5px; }
        a { text-decoration: none; color: #0066cc; font-weight: bold; text-transform: capitalize; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>My HTML Pages Directory</h1>
    <p>Below is an automatically updated list of all the pages in this repository:</p>
    
    <ul id="pages-list">Loading files...</ul>

    <script>
        // Replace these with your actual GitHub details
        const username = 'aroura-writes';
        const repo = 'Experiments';

        async function fetchPages() {
            const listElement = document.getElementById('pages-list');
            try {
                // Fetch the list of files from your main repository branch using GitHub's public API
                const response = await fetch(`https://github.com{username}/${repo}/contents/`);
                const files = await response.json();

                // Clear the loading message
                listElement.innerHTML = '';

                // Filter out non-HTML files and exclude this main index.html file
                const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');

                if (htmlFiles.length === 0) {
                    listElement.innerHTML = '<li>No other HTML pages found.</li>';
                    return;
                }

                // Dynamically build list items and clickable links
                htmlFiles.forEach(file => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    
                    // Create relative link (e.g., "moon.html")
                    a.href = file.name; 
                    // Clean up the name for display (e.g., "moon.html" becomes "Moon")
                    a.textContent = file.name.replace('.html', '').replace('-', ' '); 
                    
                    li.appendChild(a);
                    listElement.appendChild(li);
                });

            } catch (error) {
                console.error('Error fetching repository files:', error);
                listElement.innerHTML = '<li>Error loading directory list. Please try again.</li>';
            }
        }

        // Run the function when the page loads
        fetchPages();
    </script>
</body>
</html>
