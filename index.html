<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Directory</title>
    <!-- Elegant, clean fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles matching your existing theme color palette */
        body {
            background-color: #120e36;
            color: #d1d5db;
            font-family: 'Lora', serif;
            line-height: 1.8;
            padding: 40px 20px;
            max-width: 650px;
            margin: 0 auto;
        }

        /* Gold subtitle text tracker at the very top */
        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e2b659;
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Main Serif Heading */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 400;
            color: #ffffff;
            text-align: center;
            line-height: 1.3;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
        }

        /* Publication date metadata subtext */
        .meta {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: #8b8ea9;
            text-align: center;
            margin-bottom: 40px;
        }

        /* Dynamic Pages Container */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        /* Styled list items mimicking your container blocks */
        li {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(226, 182, 89, 0.3);
            transform: translateY(-2px);
        }

        /* Clickable links matching your distinctive light violet text color */
        a {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            text-decoration: none;
            color: #c09fed;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Small structural styles for loading and error flags */
        .status-msg {
            text-align: center;
            font-style: italic;
            color: #8b8ea9;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Generic project headings (Change these to whatever you want) -->
    <div class="subtitle">
        <span>✦</span> DIGITAL LABORATORY <span>✦</span>
    </div>
    
    <h1>CODE & CREATIVE<br>EXPERIMENTS</h1>
    
    <div class="meta">Select a project file from the directory index below:</div>
    
    <!-- Dynamic directory target container -->
    <ul id="pages-list">
        <li class="status-msg">Scanning your repository files...</li>
    </ul>

    <script>
        // Configured directly to target your unique Github username and repo name
        const username = 'aroura-writes';
        const repo = 'Experiments';

        async function fetchPages() {
            const listElement = document.getElementById('pages-list');
            try {
                const response = await fetch(`https://github.com{username}/${repo}/contents/`);
                const files = await response.json();

                // Clear out default loading state text
                listElement.innerHTML = '';

                // Filters out non-html pages and prevents the directory page itself from creating infinite loop links
                const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');

                if (htmlFiles.length === 0) {
                    listElement.innerHTML = '<li class="status-msg">No active experiment files found in directory.</li>';
                    return;
                }

                // Generates styled links inside list tags
                htmlFiles.forEach(file => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    
                    a.href = file.name; 
                    
                    // Format file strings elegantly for clean titles (e.g., 'moon.html' to 'MOON')
                    const polishedName = file.name.replace('.html', '').replace(/[-_]/g, ' ');
                    a.textContent = polishedName.toUpperCase(); 
                    
                    li.appendChild(a);
                    listElement.appendChild(li);
                });

            } catch (error) {
                console.error('Error auto-generating index list:', error);
                listElement.innerHTML = '<li class="status-msg">Unable to render index directory dynamically.</li>';
            }
        }

        fetchPages();
    </script>
</body>
</html>
